<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://image.flaticon.com/icons/png/128/2972/2972531.png">
    <title>Clock App - Fullscreen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-color: #fff;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
            --button-bg: rgba(255, 255, 255, 0.2);
            --button-hover: rgba(255, 255, 255, 0.3);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        /* Default dark theme */
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #2c3e50 0%, #1a1a2e 100%);
            --text-color: #f0f0f0;
            --card-bg: rgba(0, 0, 0, 0.4);
            --card-border: rgba(255, 255, 255, 0.1);
            --button-bg: rgba(255, 255, 255, 0.1);
            --button-hover: rgba(255, 255, 255, 0.2);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-color: #fff;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
            --button-bg: rgba(255, 255, 255, 0.2);
            --button-hover: rgba(255, 255, 255, 0.3);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: var(--bg-gradient);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .clock-section {
            text-align: center;
            flex: 0 1 auto;
        }

        #time {
            font-size: clamp(2.5rem, 15vw, 6rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        #date {
            font-size: clamp(1rem, 4vw, 1.8rem);
            margin-top: 5px;
            opacity: 0.9;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0 15px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50px;
            flex: 0 1 auto;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .control-item label {
            font-weight: 600;
        }

        select, button {
            padding: 6px 12px;
            border: none;
            border-radius: 30px;
            background: var(--button-bg);
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            border: 1px solid var(--card-border);
            font-size: 0.9rem;
        }

        select:hover, button:hover {
            background: var(--button-hover);
        }

        select option {
            background: #222;
            color: white;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            flex: 1 1 auto;
            min-height: 0;
        }

        .card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 18px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.15);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            font-size: 0.9rem;
        }

        .card input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .button-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .button-group button {
            flex: 1 1 auto;
            min-width: 50px;
            padding: 6px 8px;
            font-size: 0.85rem;
        }

        #stopwatchDisplay, #timerDisplay {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .lap-times {
            margin-top: 10px;
            max-height: 80px;
            overflow-y: auto;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.2);
            padding: 5px;
            border-radius: 6px;
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .container { padding: 12px; }
            .controls-bar { 
                flex-direction: column; 
                align-items: stretch; 
                border-radius: 30px;
            }
            .control-item { justify-content: space-between; }
            .feature-grid { 
                grid-template-columns: 1fr; 
                gap: 10px;
            }
            #stopwatchDisplay, #timerDisplay { font-size: 1.8rem; }
        }

        /* Very small screens */
        @media (max-width: 360px) {
            #time { font-size: 2.5rem; }
            .card h3 { font-size: 1rem; }
            .button-group button { font-size: 0.75rem; }
        }

        .theme-toggle {
            background: transparent;
            border: 2px solid var(--text-color);
            padding: 6px 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Clock Display -->
        <div class="clock-section">
            <div id="time">--:--:--</div>
            <div id="date">---</div>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <div class="control-item">
                <label>Format:</label>
                <select id="formatSelect">
                    <option value="24">24-hour</option>
                    <option value="12">12-hour</option>
                </select>
            </div>
            <div class="control-item">
                <label>Timezone:</label>
                <select id="timezoneSelect">
                    <option value="local">Local</option>
                    <option value="UTC">UTC</option>
                    <option value="America/New_York">New York</option>
                    <option value="Europe/London">London</option>
                    <option value="Asia/Tokyo">Tokyo</option>
                    <option value="Asia/Karachi">Pakistan</option> <!-- Added Pakistan -->
                </select>
            </div>
            <div class="control-item">
                <button id="themeToggle" class="theme-toggle">☀️ Light Mode</button>
            </div>
        </div>

        <!-- Alarm, Stopwatch, Timer Grid -->
        <div class="feature-grid">
            <!-- Alarm Card -->
            <div class="card">
                <h3>⏰ Alarm</h3>
                <input type="time" id="alarmTime" value="07:00">
                <div class="button-group">
                    <button id="setAlarmBtn">Set</button>
                    <button id="clearAlarmBtn">Clear</button>
                </div>
                <div id="alarmStatus" style="margin-top: 8px; font-size: 0.85rem;">No alarm set</div>
            </div>

            <!-- Stopwatch Card -->
            <div class="card">
                <h3>⏱️ Stopwatch</h3>
                <div id="stopwatchDisplay">00:00.0</div>
                <div class="button-group">
                    <button id="startStopwatch">Start</button>
                    <button id="lapStopwatch">Lap</button>
                    <button id="resetStopwatch">Reset</button>
                </div>
                <div id="laps" class="lap-times"></div>
            </div>

            <!-- Timer Card -->
            <div class="card">
                <h3>⏲️ Timer</h3>
                <input type="number" id="timerMinutes" placeholder="Minutes" min="0" value="1">
                <input type="number" id="timerSeconds" placeholder="Seconds" min="0" max="59" value="0">
                <div id="timerDisplay">01:00</div>
                <div class="button-group">
                    <button id="startTimer">Start</button>
                    <button id="pauseTimer">Pause</button>
                    <button id="resetTimer">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== GLOBALS & UTILITIES ====================
        let animationFrame;
        let is24Hour = true;
        let selectedTimezone = 'local';
        let theme = 'dark';   // default dark

        // Alarm
        let alarmTime = null;
        let alarmSound = null;

        // Stopwatch
        let stopwatchRunning = false;
        let stopwatchStartTime = 0;
        let stopwatchElapsed = 0;
        let stopwatchInterval = null;
        let laps = [];

        // Timer
        let timerRunning = false;
        let timerPaused = false;
        let timerDuration = 60;
        let timerRemaining = 60;
        let timerInterval = null;

        // DOM elements
        const timeElement = document.getElementById('time');
        const dateElement = document.getElementById('date');
        const formatSelect = document.getElementById('formatSelect');
        const timezoneSelect = document.getElementById('timezoneSelect');
        const themeToggle = document.getElementById('themeToggle');

        const alarmTimeInput = document.getElementById('alarmTime');
        const setAlarmBtn = document.getElementById('setAlarmBtn');
        const clearAlarmBtn = document.getElementById('clearAlarmBtn');
        const alarmStatus = document.getElementById('alarmStatus');

        const stopwatchDisplay = document.getElementById('stopwatchDisplay');
        const startStopwatchBtn = document.getElementById('startStopwatch');
        const lapStopwatchBtn = document.getElementById('lapStopwatch');
        const resetStopwatchBtn = document.getElementById('resetStopwatch');
        const lapsContainer = document.getElementById('laps');

        const timerMinutes = document.getElementById('timerMinutes');
        const timerSeconds = document.getElementById('timerSeconds');
        const timerDisplay = document.getElementById('timerDisplay');
        const startTimerBtn = document.getElementById('startTimer');
        const pauseTimerBtn = document.getElementById('pauseTimer');
        const resetTimerBtn = document.getElementById('resetTimer');

        // ==================== LOAD SETTINGS FROM LOCALSTORAGE ====================
        function loadSettings() {
            const savedFormat = localStorage.getItem('clockFormat');
            if (savedFormat) {
                is24Hour = savedFormat === '24';
                formatSelect.value = savedFormat;
            }

            const savedTimezone = localStorage.getItem('clockTimezone');
            if (savedTimezone) {
                selectedTimezone = savedTimezone;
                timezoneSelect.value = savedTimezone;
            }

            const savedTheme = localStorage.getItem('clockTheme');
            if (savedTheme) {
                theme = savedTheme;
            } else {
                theme = 'dark';
                localStorage.setItem('clockTheme', 'dark');
            }
            document.documentElement.setAttribute('data-theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️ Light Mode' : '🌓 Dark Mode';
        }

        // ==================== TIME UPDATE ====================
        function updateTime() {
            const now = new Date();

            if (selectedTimezone !== 'local') {
                const timeStr = now.toLocaleTimeString('en-US', { timeZone: selectedTimezone, hour12: !is24Hour, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const dateStr = now.toLocaleDateString('en-US', { timeZone: selectedTimezone, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                timeElement.textContent = timeStr;
                dateElement.textContent = dateStr;
            } else {
                let hours = now.getHours();
                let minutes = now.getMinutes();
                let seconds = now.getSeconds();
                let ampm = '';

                if (!is24Hour) {
                    ampm = hours >= 12 ? ' PM' : ' AM';
                    hours = hours % 12 || 12;
                }

                const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}${!is24Hour ? ampm : ''}`;
                const dateString = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                timeElement.textContent = timeString;
                dateElement.textContent = dateString;
            }

            // Check alarm
            if (alarmTime) {
                const currentHour = now.getHours().toString().padStart(2, '0');
                const currentMinute = now.getMinutes().toString().padStart(2, '0');
                const currentTimeStr = `${currentHour}:${currentMinute}`;

                if (currentTimeStr === alarmTime) {
                    triggerAlarm();
                }
            }

            animationFrame = requestAnimationFrame(updateTime);
        }

        // ==================== ALARM ====================
        function triggerAlarm() {
            alarmTime = null;
            alarmStatus.textContent = 'No alarm set';
            localStorage.removeItem('clockAlarm');

            if (Notification.permission === 'granted') {
                new Notification('⏰ Alarm!', { body: 'Your alarm time has been reached.' });
            } else if (Notification.permission !== 'denied') {
                Notification.requestPermission();
            }

            if (!alarmSound) {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 800;
                gainNode.gain.value = 0.5;
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 1);
                alarmSound = setTimeout(() => { alarmSound = null; }, 1000);
            }
        }

        setAlarmBtn.addEventListener('click', () => {
            const timeValue = alarmTimeInput.value;
            if (!timeValue) {
                alert('Please set a valid time.');
                return;
            }
            alarmTime = timeValue;
            alarmStatus.textContent = `Alarm set for ${alarmTime}`;
            localStorage.setItem('clockAlarm', alarmTime);

            if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }
        });

        clearAlarmBtn.addEventListener('click', () => {
            alarmTime = null;
            alarmStatus.textContent = 'No alarm set';
            localStorage.removeItem('clockAlarm');
        });

        const savedAlarm = localStorage.getItem('clockAlarm');
        if (savedAlarm) {
            alarmTime = savedAlarm;
            alarmStatus.textContent = `Alarm set for ${alarmTime}`;
        }

        // ==================== STOPWATCH ====================
        function formatStopwatch(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            const tenth = Math.floor((seconds * 10) % 10);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${tenth}`;
        }

        function updateStopwatch() {
            if (!stopwatchRunning) return;
            const now = Date.now();
            const elapsedSeconds = (now - stopwatchStartTime) / 1000 + stopwatchElapsed;
            stopwatchDisplay.textContent = formatStopwatch(elapsedSeconds);
            stopwatchInterval = setTimeout(updateStopwatch, 100);
        }

        startStopwatchBtn.addEventListener('click', () => {
            if (stopwatchRunning) {
                stopwatchRunning = false;
                clearTimeout(stopwatchInterval);
                stopwatchElapsed += (Date.now() - stopwatchStartTime) / 1000;
                startStopwatchBtn.textContent = 'Start';
            } else {
                stopwatchRunning = true;
                stopwatchStartTime = Date.now();
                updateStopwatch();
                startStopwatchBtn.textContent = 'Pause';
            }
        });

        lapStopwatchBtn.addEventListener('click', () => {
            if (!stopwatchRunning) return;
            const current = stopwatchElapsed + (Date.now() - stopwatchStartTime) / 1000;
            laps.push(formatStopwatch(current));
            const lapItem = document.createElement('div');
            lapItem.textContent = `Lap ${laps.length}: ${formatStopwatch(current)}`;
            lapsContainer.appendChild(lapItem);
        });

        resetStopwatchBtn.addEventListener('click', () => {
            stopwatchRunning = false;
            clearTimeout(stopwatchInterval);
            stopwatchElapsed = 0;
            stopwatchDisplay.textContent = '00:00.0';
            startStopwatchBtn.textContent = 'Start';
            laps = [];
            lapsContainer.innerHTML = '';
        });

        // ==================== TIMER ====================
        function formatTimer(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimer() {
            if (!timerRunning || timerPaused) return;
            if (timerRemaining <= 0) {
                timerRunning = false;
                timerDisplay.textContent = '00:00';
                if (Notification.permission === 'granted') {
                    new Notification('⏲️ Timer Finished!', { body: 'Your countdown timer has ended.' });
                }
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                oscillator.connect(audioCtx.destination);
                oscillator.frequency.value = 600;
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
                return;
            }
            timerRemaining--;
            timerDisplay.textContent = formatTimer(timerRemaining);
            timerInterval = setTimeout(updateTimer, 1000);
        }

        startTimerBtn.addEventListener('click', () => {
            if (timerRunning) {
                timerPaused = !timerPaused;
                startTimerBtn.textContent = timerPaused ? 'Resume' : 'Pause';
                if (!timerPaused) updateTimer();
            } else {
                const mins = parseInt(timerMinutes.value) || 0;
                const secs = parseInt(timerSeconds.value) || 0;
                timerDuration = mins * 60 + secs;
                if (timerDuration <= 0) {
                    alert('Please set a positive duration.');
                    return;
                }
                timerRemaining = timerDuration;
                timerDisplay.textContent = formatTimer(timerRemaining);
                timerRunning = true;
                timerPaused = false;
                startTimerBtn.textContent = 'Pause';
                updateTimer();
            }
        });

        pauseTimerBtn.addEventListener('click', () => {
            timerRunning = false;
            timerPaused = false;
            startTimerBtn.textContent = 'Start';
            clearTimeout(timerInterval);
        });

        resetTimerBtn.addEventListener('click', () => {
            timerRunning = false;
            timerPaused = false;
            clearTimeout(timerInterval);
            const mins = parseInt(timerMinutes.value) || 0;
            const secs = parseInt(timerSeconds.value) || 0;
            timerDuration = mins * 60 + secs;
            timerRemaining = timerDuration;
            timerDisplay.textContent = formatTimer(timerRemaining);
            startTimerBtn.textContent = 'Start';
        });

        // ==================== SETTINGS CHANGE HANDLERS ====================
        formatSelect.addEventListener('change', (e) => {
            is24Hour = e.target.value === '24';
            localStorage.setItem('clockFormat', e.target.value);
        });

        timezoneSelect.addEventListener('change', (e) => {
            selectedTimezone = e.target.value;
            localStorage.setItem('clockTimezone', selectedTimezone);
        });

        themeToggle.addEventListener('click', () => {
            const newTheme = theme === 'dark' ? 'light' : 'dark';
            theme = newTheme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('clockTheme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️ Light Mode' : '🌓 Dark Mode';
        });

        // ==================== INITIALIZE ====================
        loadSettings();
        updateTime();

        window.addEventListener('beforeunload', () => {
            cancelAnimationFrame(animationFrame);
            clearTimeout(stopwatchInterval);
            clearTimeout(timerInterval);
        });
    </script>
</body>
</html>
